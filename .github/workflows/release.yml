name: Build connect-migrate

# Two trigger modes:
#
# - `workflow_dispatch` for ad-hoc CI runs (developer iteration). The
#   router ref is taken from the input; the binary version is the
#   default "0.0.0-dev" baked in by the source.
# - `push: tags: ['v*']` for cutting a release. The router ref is
#   pinned by `env.RELEASE_ROUTER_REF` below (bump per release as the
#   pinned router commit moves), and the binary version is read from
#   the tag name (stripping the leading `v`). The `release` job at
#   the bottom turns the matrix artifacts into a GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      router_ref:
        description: 'apollographql/router ref (branch, tag, or commit) to build from'
        required: true
        default: 'benjamn/connect-migrate-analyze'

env:
  # Router commit used by tag-triggered release builds. Pin to a full
  # 40-character SHA (not a branch, not an abbreviated SHA) so a
  # tagged release is immutable and `actions/checkout@v4` resolves
  # the ref correctly — checkout treats a short SHA as a branch
  # pattern and silently fails to find it (see v0.0.2's failed build
  # for the worked example). Bump as the connect-migrate tool catches
  # up with apollo-federation changes.
  RELEASE_ROUTER_REF: '9f945fb0f6dff741eb11a1991baabebec944c1a5'

jobs:
  build:
    name: ${{ matrix.target.platform }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: darwin-arm64,  os: macos-latest,   triple: aarch64-apple-darwin,       cross: false, smoke: true  }
          # `macos-13` Intel runners have been deprecated and may queue
          # indefinitely. Build x86_64-apple-darwin from `macos-latest`
          # (Apple Silicon) using Apple's bi-arch toolchain. Smoke test
          # disabled — arm64 host can't natively run an x86_64 binary
          # without Rosetta, which isn't pre-installed.
          - { platform: darwin-x64,    os: macos-latest,   triple: x86_64-apple-darwin,        cross: false, smoke: false }
          - { platform: linux-x64,     os: ubuntu-latest,  triple: x86_64-unknown-linux-gnu,   cross: false, smoke: true  }
          - { platform: linux-arm64,   os: ubuntu-latest,  triple: aarch64-unknown-linux-gnu,  cross: true,  smoke: false }
          - { platform: win32-x64,     os: windows-latest, triple: x86_64-pc-windows-msvc,     cross: false, smoke: true  }
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout connect-migrate workflow
        uses: actions/checkout@v4

      - name: Enable git long-path support (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout apollographql/router
        uses: actions/checkout@v4
        with:
          repository: apollographql/router
          ref: ${{ inputs.router_ref || env.RELEASE_ROUTER_REF }}
          path: router

      - name: Derive connect-migrate version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Strip leading "v" from tag name (e.g. v0.0.1 -> 0.0.1)
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "CONNECT_MIGRATE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "connect-migrate version: $VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      # router/ has its own rust-toolchain.toml pinning channel 1.95.0.
      # dtolnay/rust-toolchain installs targets against the action-default
      # channel (stable), so when cargo runs inside router/ and switches
      # to 1.95.0 it may not have the target installed for that channel.
      # Re-add the target from inside router/ so it applies to whichever
      # toolchain router pins. No-op for native builds.
      - name: Add Rust target for router's pinned toolchain
        if: '!matrix.target.cross'
        working-directory: router
        run: rustup target add ${{ matrix.target.triple }}

      - name: Cache cargo deps
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: router

      - name: Install cross (linux-arm64 only)
        if: matrix.target.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build connect-migrate (native)
        if: '!matrix.target.cross'
        working-directory: router/apollo-federation
        run: cargo build --release --target ${{ matrix.target.triple }} --bin connect-migrate --features connect-migrate

      - name: Build connect-migrate (cross)
        if: matrix.target.cross
        working-directory: router/apollo-federation
        env:
          # Tell Docker to inherit CONNECT_MIGRATE_VERSION from the host env
          # so cross's containerized cargo invocation can see it.
          # Without this, the cross-built binary falls back to the
          # "0.0.0-dev" default baked into main.rs.
          CROSS_CONTAINER_OPTS: '-e CONNECT_MIGRATE_VERSION'
        run: cross build --release --target ${{ matrix.target.triple }} --bin connect-migrate --features connect-migrate

      - name: Strip (Unix, native)
        if: runner.os != 'Windows' && !matrix.target.cross
        working-directory: router
        run: strip target/${{ matrix.target.triple }}/release/connect-migrate

      # Cross-compiled binaries can't be stripped by the host's `strip`
      # (different ELF arch). We could install a cross-arch strip from
      # binutils-aarch64-linux-gnu, but for now we accept the larger
      # binary and skip stripping on cross builds.
      - name: Skip strip (cross)
        if: matrix.target.cross
        run: echo "Skipping strip for cross-compiled ${{ matrix.target.triple }}"

      - name: Smoke-test the binary (Unix)
        if: matrix.target.smoke && runner.os != 'Windows'
        working-directory: router
        run: |
          ./target/${{ matrix.target.triple }}/release/connect-migrate --version
          ./target/${{ matrix.target.triple }}/release/connect-migrate agent-guide | head -3

      - name: Smoke-test the binary (Windows)
        if: matrix.target.smoke && runner.os == 'Windows'
        working-directory: router
        shell: pwsh
        run: |
          .\target\${{ matrix.target.triple }}\release\connect-migrate.exe --version
          .\target\${{ matrix.target.triple }}\release\connect-migrate.exe agent-guide | Select-Object -First 3

      - name: Stage artifact
        shell: bash
        working-directory: router
        run: |
          mkdir -p ../artifact
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target.triple }}/release/connect-migrate.exe" "../artifact/connect-migrate-${{ matrix.target.platform }}.exe"
          else
            cp "target/${{ matrix.target.triple }}/release/connect-migrate" "../artifact/connect-migrate-${{ matrix.target.platform }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: connect-migrate-${{ matrix.target.platform }}
          path: artifact/connect-migrate-${{ matrix.target.platform }}*
          if-no-files-found: error

  summary:
    name: Summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List built binaries
        run: ls -lah artifacts/*/connect-migrate-*

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree + compute checksums
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -name 'connect-migrate-*' -exec cp -v {} release/ \;
          cd release
          sha256sum connect-migrate-* > SHA256SUMS
          ls -lah

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            connect-migrate ${{ github.ref_name }}, built from apollographql/router @ `${{ env.RELEASE_ROUTER_REF }}`.

            See [SKILL.md](https://github.com/apollographql/connect-migrate/blob/main/SKILL.md) for the developer-facing migration guide (also embedded in the binary via `connect-migrate agent-guide`).

            Verify a downloaded binary against `SHA256SUMS`.
          files: |
            release/connect-migrate-*
            release/SHA256SUMS
          fail_on_unmatched_files: true
